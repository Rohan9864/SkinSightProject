spring.profiles.active=local
spring.application.name=SkinSightBackend

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/skinsight_db
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${SKINSIGHT_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
#spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.jwt.secret=${SKINSIGHT_JWT_SECRET}
app.jwt.expiration=86400000


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=knktestmail@gmail.com
spring.mail.password=${SKINSIGHT_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.upload.dir=uploads/
app.upload.cases.dir=uploads/cases/
app.upload.heatmaps.dir=uploads/heatmaps/
app.upload.reports.dir=uploads/reports/
app.upload.max-size=10485760
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
spring.jackson.deserialization.FAIL_ON_UNKNOWN_PROPERTIES=false

ml.service.url=http://localhost:8000
ml.service.endpoint=/api/analyze

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

app.base.url=http://localhost:8080

logging.level.root=INFO
logging.level.com.Backend.SkinSight=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

management.endpoints.web.exposure.include=health,info





